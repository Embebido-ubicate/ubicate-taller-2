server:
  port: 8080
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/georoute_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456789}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: NON_NULL

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:dGVzdGluZ19zZWNyZXRfa2V5X2Zvcl9nZW9yb3V0ZV9hcHBfMjAyNQ==}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

# Logging
logging:
  level:
    com.georoute: DEBUG
    org.springframework.security: INFO
    root: INFO

# Actuator for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Información de la aplicación
info:
  app:
    name: '@project.name@'
    description: '@project.description@'
    version: '@project.version@'