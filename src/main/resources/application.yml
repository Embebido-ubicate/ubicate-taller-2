spring:
  application:
    name: georoute

  # Base de datos simple
  datasource:
    url: jdbc:mysql://localhost:3306/georoute?createDatabaseIfNotExist=true
    username: root
    password: 123456789
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA simple
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

# JWT simple
jwt:
  secret: MiClaveSecretaParaGeoRoute2024
  expiration: 86400000

# Google Maps Configuration
google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:AIza...tu_api_key_aqui}

# Server
server:
  port: 8080

# Logging mínimo
logging:
  level:
    com.georoute: INFO
    org.springframework.security: WARN